name: Publish frontend image

on:
  push:
    branches: [deploy/azure]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/modalink-frontend:latest
            ghcr.io/${{ github.repository_owner }}/modalink-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
